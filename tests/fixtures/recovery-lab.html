<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepoGuard Recovery Lab</title><style>body{margin:0;background:#070a0f;color:#dbe5f2;font:15px system-ui}main{max-width:960px;margin:32px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#101722;border:1px solid #263449;border-radius:16px;padding:18px}.critical{border-color:#7f1d1d}.ok{color:#86efac}.muted{color:#93a4ba}button{background:#172235;color:#e8eef8;border:1px solid #3a4c67;border-radius:10px;padding:10px 14px}</style></head><body><main><h1>RepoGuard Recovery Lab</h1><p class="muted">Static-analysis recovery prototype. No payload execution.</p><div class="grid"><div class="card critical"><h2>Threat</h2><p>Simulated malware indicators</p><strong>TEST ONLY</strong></div><div class="card"><h2>Detection</h2><p class="ok">Fixture queued for static scan</p></div><div class="card"><h2>Recovery</h2><p>Future mode: quarantine, snapshot, diff, restore.</p></div></div><p><button onclick="document.getElementById('status').textContent='Recovery simulation complete: no code executed'">Simulate recovery</button></p><p id="status" class="ok"></p></main></body></html>
