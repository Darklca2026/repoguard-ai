ignore:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - ".git/**"
  - "coverage/**"

rules:
  secrets: true
  promptInjection: true
  githubActions: true
  dangerousCode: true
  aiGenerated: true
  aiPoisoning: true
  agentSecurity: true

severity:
  failOn: HIGH

maxFileSizeKb: 1024

suppressions:
  enabled: true
  requireReason: true
  requireExpiry: false
  maxExpiryDays: 365
