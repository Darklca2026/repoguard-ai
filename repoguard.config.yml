# RepoGuard AI Configuration (Dogfooding for our own repository)
ignore:
  - "tests/"
  - "docs/"
  - "examples/"
  - "README.md"
  - "src/cli.ts" # Contains fake canary credentials generated by the CLI
  - "src/rules/secrets.ts" # Contains secret signatures used by the detector
  - "src/rules/github-actions.ts" # Contains dangerous workflow patterns used by the detector
  - "src/rules/dangerous-code.ts" # We have literal eval strings here that our own rule will catch!
  - "src/rules/prompt-injection.ts" # We have literal prompt injection texts here
  - "src/rules/agent-security.ts" # Contains risky MCP and agent patterns used by the detector

severity:
  failOn: "HIGH"
