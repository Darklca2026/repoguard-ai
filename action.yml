name: 'RepoGuard AI Scanner'
description: 'Scans your repository for leaked secrets, prompt injections, and dangerous code.'
author: 'RepoGuard AI'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  config:
    description: 'Path to custom repoguard.config.yml'
    required: false
  fail-on:
    description: 'Severity level to fail the action (LOW, MEDIUM, HIGH, CRITICAL)'
    required: false
    default: 'HIGH'
  format:
    description: 'Output format: terminal, json, or sarif'
    required: false
    default: 'terminal'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
    - name: Install RepoGuard AI globally
      run: npm install -g repoguard-ai
      shell: bash
    - name: Run Scan
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        args=(scan . --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config "$INPUT_CONFIG")
        fi
        case "$INPUT_FORMAT" in
          terminal) repoguard-ai "${args[@]}" ;;
          json) repoguard-ai "${args[@]}" --json ;;
          sarif) repoguard-ai "${args[@]}" --sarif > repoguard-results.sarif ;;
          *) echo "Unsupported output format: $INPUT_FORMAT" >&2; exit 1 ;;
        esac
      shell: bash
    - name: Upload SARIF file (if selected)
      if: inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: repoguard-results.sarif
