name: 'RepoGuard AI Scanner'
description: 'Scans repositories for leaked secrets and risky AI, agent, MCP, CI, and code patterns.'
author: 'Darklca2026'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'File or directory to scan'
    required: false
    default: '.'
  config:
    description: 'Path to custom repoguard.config.yml'
    required: false
  fail-on:
    description: 'Severity level to fail the action (LOW, MEDIUM, HIGH, CRITICAL)'
    required: false
    default: 'HIGH'
  format:
    description: 'Output format: terminal, json, or sarif'
    required: false
    default: 'terminal'
  baseline:
    description: 'Optional path to a RepoGuard baseline JSON file'
    required: false
  changed-since:
    description: 'Optional Git ref; scan only files changed between this ref and HEAD'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '24'
    - name: Run Scan
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CHANGED_SINCE: ${{ inputs.changed-since }}
      run: |
        set +e
        args=(scan "$INPUT_PATH" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config "$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_BASELINE" ]; then
          args+=(--baseline "$INPUT_BASELINE")
        fi
        if [ -n "$INPUT_CHANGED_SINCE" ]; then
          args+=(--changed-since "$INPUT_CHANGED_SINCE")
        fi
        case "$INPUT_FORMAT" in
          terminal) node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" ;;
          json) node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" --json ;;
          sarif) node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" --sarif > repoguard-results.sarif ;;
          *) echo "Unsupported output format: $INPUT_FORMAT" >&2; exit 1 ;;
        esac
        status=$?
        if [ "$INPUT_FORMAT" = "sarif" ]; then
          echo "$status" > "$RUNNER_TEMP/repoguard-exit-code"
          exit 0
        fi
        exit "$status"
      shell: bash
    - name: Upload SARIF file (if selected)
      if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
      with:
        sarif_file: repoguard-results.sarif
    - name: Enforce SARIF scan result
      if: inputs.format == 'sarif' && always()
      run: exit "$(cat "$RUNNER_TEMP/repoguard-exit-code")"
      shell: bash
